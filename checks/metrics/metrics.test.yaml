# The rules nixos/metrics.nix holds on the metrics themselves: the Watchdog, a target that answers no scrape, or that no
# scrape reaches at all, a writer's file that goes stale, or was never written, and a family a writer leaves out.
rule_files:
  - rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="node", instance="127.0.0.1:9100"}'
        values: '1x10 0x30 1x30'
    alert_rule_test:
      - eval_time: 5m
        groupname: metrics
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {}
      - eval_time: 20m
        groupname: metrics
        alertname: target down
        exp_alerts: []
      - eval_time: 30m
        groupname: metrics
        alertname: target down
        exp_alerts:
          - &node
            exp_labels: {job: node, priority: "4"}
            exp_annotations:
              title: metric target down
              cleared: metric targets up again
              detail: no answer to the scrape
              key: node
              lost: node
      # It stands for as long again as it is held for, then clears.
      - eval_time: 50m
        groupname: metrics
        alertname: target down
        exp_alerts: [*node]
      - eval_time: 58m
        groupname: metrics
        alertname: target down
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{job="node", instance="127.0.0.1:9100"}'
        values: '1x10 _x30'
    alert_rule_test:
      - eval_time: 30m
        groupname: metrics
        alertname: target down
        exp_alerts: [*node]
  - interval: 1m
    input_series:
      - series: 'up{job="node", instance="127.0.0.1:9100"}'
        values: '1x60'
      # Written each minute for the first ten, then no more, in vmalert-tool's time, which starts in 2000; the other
      # writers' files were never there.
      - series: 'node_textfile_mtime_seconds{job="node", instance="127.0.0.1:9100", file="/run/suveraen-metrics-textfiles/pools.prom"}'
        values: '946684800+60x10 946685400x50'
    alert_rule_test:
      - eval_time: 25m
        groupname: metrics
        alertname: input stale
        exp_alerts:
          - &chrony
            exp_labels: {writer: chrony, priority: "4"}
            exp_annotations:
              title: metric input stale
              cleared: metric inputs fresh again
              detail: not written by its last three runs, or unreadable
              key: chrony
              inputs: node
              lost: chrony
          - &datasets
            exp_labels: {writer: datasets, priority: "4"}
            exp_annotations:
              title: metric input stale
              cleared: metric inputs fresh again
              detail: not written by its last three runs, or unreadable
              key: datasets
              inputs: node
              lost: datasets
      - eval_time: 45m
        groupname: metrics
        alertname: input stale
        exp_alerts:
          - *chrony
          - *datasets
          - exp_labels: {writer: pools, priority: "4"}
            exp_annotations:
              title: metric input stale
              cleared: metric inputs fresh again
              detail: not written by its last three runs, or unreadable
              key: pools
              inputs: node
              lost: pools
  - interval: 1m
    input_series:
      - series: 'up{job="node", instance="127.0.0.1:9100"}'
        values: '0x60'
    alert_rule_test:
      # A target that doesn't answer is down, and the files it reads aren't stale.
      - eval_time: 45m
        groupname: metrics
        alertname: input stale
        exp_alerts: []
