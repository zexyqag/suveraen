name: checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      changes:
        description: Check the commit with the patch in the calling run's artifact "changes" applied.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - if: inputs.changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: ${{ runner.temp }}
      # A flake holds only the files git tracks.
      - if: inputs.changes
        run: |
          git apply --index "$RUNNER_TEMP/changes.patch"
          if git status --porcelain --untracked-files=all | grep '^??'; then exit 1; fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check --no-build
      - id: names
        run: echo "names=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  # One runner per check: VM tests sharing a runner's cores and disk slow each other past their timeouts.
  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.list.outputs.names) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - if: inputs.changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: ${{ runner.temp }}
      # A flake holds only the files git tracks.
      - if: inputs.changes
        run: |
          git apply --index "$RUNNER_TEMP/changes.patch"
          if git status --porcelain --untracked-files=all | grep '^??'; then exit 1; fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # The unlock check's disk image is made by systemd-repart under unshare --map-root-user, which Ubuntu's
      # AppArmor refuses to an unprivileged process unless this is off.
      - run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - env:
          CHECK: ${{ matrix.name }}
        run: nix build -L --no-link ".#checks.x86_64-linux.$CHECK"
