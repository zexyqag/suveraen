name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check -L

  # Flux deploys kubernetes/clusters/test onto a server VM built from the same modules. Charts and images come
  # from the internet, which nix flake check's sandbox doesn't have, and the VM runs them: never give this job
  # secrets or write access.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # The VM's disk, the images it pulls and the Nix store need more room than the runner leaves free.
      - run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # The test driver runs as the runner's user, which can't open /dev/kvm by default.
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The VMs' disks grow with every image they pull; the runner's second disk has the room.
      - run: |
          sudo install -d -o "$USER" /mnt/e2e
          TMPDIR=/mnt/e2e nix run -L .#e2e
      - if: always()
        run: df -h / /mnt && free -m
