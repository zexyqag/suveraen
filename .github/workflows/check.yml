name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check -L

  # Flux deploys kubernetes/clusters/test onto a server VM built from the same modules. Charts and images come
  # from the internet, which nix flake check's sandbox doesn't have, and the VM runs them: never give this job
  # secrets or write access.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # The VM's disk, the images it pulls and the Nix store need more room than the runner leaves free.
      - run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # The test driver runs as the runner's user, which can't open /dev/kvm by default.
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - shell: bash
        run: |
          uname -r; ulimit -a; cat /proc/self/cgroup; cat /proc/sys/kernel/io_uring_disabled || true
          sudo install -d -o "$USER" /mnt/e2e
          sudo dmesg -wT > /mnt/e2e/host-dmesg 2>&1 &
          vmstat -t 30 > /mnt/e2e/vmstat &
          TMPDIR=/mnt/e2e nix run -L .#e2e 2>&1 | tee /mnt/e2e/log
      - if: always()
        shell: bash
        run: |
          df -h / /mnt && free -m
          grep -aE "(qemu-system-x86_64|qcow2|block)[^ ]*:" /mnt/e2e/log | grep -v "terminating on signal" | head -n 30 || true
          grep -a -m 3 -B 20 "I/O error, dev" /mnt/e2e/log || true
          tail -n 60 /mnt/e2e/host-dmesg
          cat /mnt/e2e/vmstat
          nix shell --inputs-from . nixpkgs#qemu-utils -c qemu-img check -U /mnt/e2e/vm-state-server/server.qcow2 || true
