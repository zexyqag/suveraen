name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/checks.yml

  # Flux deploys kubernetes/clusters/test onto a server VM built from the same modules. Charts and images come
  # from the internet, which nix flake check's sandbox doesn't have, and the VM runs them: never give this job
  # secrets or write access.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # The test driver runs as the runner's user, which can't open /dev/kvm by default.
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The test driver keeps the VMs' disks in XDG_RUNTIME_DIR when it's set, a tmpfs of a tenth of the runner's
      # memory; without it they go to TMPDIR on the runner's disk.
      - run: env -u XDG_RUNTIME_DIR nix run -L .#e2e
