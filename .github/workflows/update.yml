name: update

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      charts:
        description: Lines of arguments to release/charts.sh, one run each, in place of the lock update
        type: string
        default: ""

permissions:
  contents: read

# Updates are new changes like any other: they go to the branch the watcher runs first, never to the release
# branch.
env:
  BRANCH: staging

jobs:
  # Fetching and building upstream code runs without write access; only the small job below can push.
  update:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.changes.outputs.base }}
      message: ${{ steps.changes.outputs.message }}
      # The checks and the push take the patch by this ID, which names its bytes alone: any job of the run could put
      # other bytes under its name.
      patch: ${{ steps.patch.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - if: inputs.charts == ''
        run: nix flake update
      # With the new lock's Flux, so its images' pins come in the same commit.
      - if: inputs.charts == ''
        run: nix run .#flux-images
      # Each line's words are arguments, never code; the lines are the loop's input, not the tool's.
      - if: inputs.charts != ''
        env:
          CHARTS: ${{ inputs.charts }}
        run: |
          while read -ra args; do
            if [ ${#args[@]} -gt 0 ]; then
              nix run .#charts -- "${args[@]}" < /dev/null
            fi
          done <<< "$CHARTS"
      - id: changes
        env:
          CHARTS: ${{ inputs.charts }}
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Named from the records, not from the lines given.
          if [ -n "$CHARTS" ]; then
            message=$(nix run .#charts -- summary)
          else
            message="flake.lock: update inputs"
          fi
          echo "message=$message" >> "$GITHUB_OUTPUT"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/changes.patch"
          if [ -s "$RUNNER_TEMP/changes.patch" ]; then
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - id: patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changes
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
          retention-days: 1

  check:
    needs: update
    if: needs.update.outputs.patch != ''
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.update.outputs.base }}
      changes: ${{ needs.update.outputs.patch }}

  push:
    needs: [update, check]
    if: needs.update.outputs.patch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
      # One ID alone: given several, the download puts each artifact under its own name, which may be "..".
      - env:
          ID: ${{ needs.update.outputs.patch }}
        run: '[[ $ID =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.update.outputs.patch }}
          path: ${{ runner.temp }}
      - env:
          BASE: ${{ needs.update.outputs.base }}
          CHARTS: ${{ inputs.charts }}
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ needs.update.outputs.message }}
        run: |
          # The checks ran on the commit the update job named, and that job ran upstream code: the branch must still be
          # that commit.
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            echo "$BRANCH isn't $BASE, which the update began from and the checks ran on." >&2
            exit 1
          fi
          git apply --index "$RUNNER_TEMP/changes.patch"
          # The patch comes from that job too: it may change only what this kind of update changes, and only as a plain
          # file. Read from the index, as a patch's own list of paths leaves out where a rename came from.
          if [ -n "$CHARTS" ]; then
            allowed='kubernetes/platform/[^/]+/vendor/.+|release/chart-keys/[0-9A-F]{40}\.asc'
          else
            allowed='flake\.lock|nixos/flux-images\.json'
          fi
          changes=$(git diff --cached --raw --no-renames)
          while IFS= read -r change; do
            read -r _ mode _ <<< "${change#:}"
            path=${change#*$'\t'}
            if ! [[ $mode =~ ^(100644|000000)$ && $path =~ ^($allowed)$ ]]; then
              echo "The update changes $path, to mode $mode, which it may not." >&2
              exit 1
            fi
          done <<< "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$MESSAGE"
          git push origin "HEAD:refs/heads/$BRANCH"
          # Pushes with this token start no workflows, and a release needs the checks' result for this commit.
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
