name: update

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fetching and building upstream code runs without write access; only the small job below can push.
  update:
    runs-on: ubuntu-latest
    outputs:
      lock: ${{ steps.lock.outputs.lock }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake update
      - run: nix flake check -L
      - id: lock
        run: git diff --quiet flake.lock || echo "lock=$(base64 -w0 flake.lock)" >> "$GITHUB_OUTPUT"

  push:
    needs: update
    if: needs.update.outputs.lock != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          LOCK: ${{ needs.update.outputs.lock }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base64 -d <<< "$LOCK" > flake.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "flake.lock: update inputs"
          git push
          # Pushes with this token start no workflows, and a release needs the checks' result for this commit.
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
