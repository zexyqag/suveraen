---
# For containers a chart leaves without requests or limits, which the quota would otherwise refuse.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 64Mi
        ephemeral-storage: 64Mi
      default:
        memory: 128Mi
        ephemeral-storage: 256Mi
