---
# Every app: its own namespace, closed in both directions and held to a quota, the way to the internet for the pods the
# platform labels alone, and the account its charts are installed with, which reaches only this namespace.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./namespace.yaml
  - ./networkpolicies.yaml
  - ./internet.yaml
  - ./limitrange.yaml
  - ./resourcequota.yaml
  - ./deployer.yaml
components:
  - ../retry
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        serviceAccountName: flux-deployer
        install:
          # CRDs are cluster-wide; only the platform installs them.
          crds: Skip
        upgrade:
          crds: Skip
