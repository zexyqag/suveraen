---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - ${HOST}.${DOMAIN}
  rules:
    - backendRefs:
        - name: ${ROUTE_SERVICE:=${APP}}
          port: ${ROUTE_PORT}
