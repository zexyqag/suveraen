---
# https://${HOST}.${DOMAIN} through the shared gateway, which only takes routes from namespaces with this label.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./httproute.yaml
  - ./networkpolicy.yaml
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: _
        labels:
          suveraen/route: "true"
