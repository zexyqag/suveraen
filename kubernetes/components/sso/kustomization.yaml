---
# An app's sign-in through its tenant's Kanidm (apps/kanidm), from the app's attachment, ${TENANT}-<app>-sso, whose
# ConfigMap sso-<app> in the tenant's Kanidm namespace holds the app's migrations: for each of its groups and its one
# OAuth2 client, <app>-oidc, a 10-<name>.json that makes it and never changes; 50-<app>.json, which states what else the
# app sets on them, with redirects to the app's own hosts; and once the app drops an entry, 05-<app>.json, under
# ${<APP>_REMOVED_ID}, which removes those it no longer has, keeps each removal for good, and comes before the files
# that make entries. Kanidm applies the files as it starts, and Reloader restarts it when one appears or changes. The
# flags no migration can set go on the ConfigMap as annotations set to "true", which suveraen-idm sync applies
# (nixos/idm.nix): suveraen/disable-pkce for a confidential client, suveraen/localhost-redirects for a public one. The
# attachment also opens Kanidm's port to the app's namespace, whose components/sso-client opens the other end.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./networkpolicy.yaml
