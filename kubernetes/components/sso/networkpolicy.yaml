---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-${APP}
  namespace: ${TENANT}-kanidm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: kanidm
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${TENANT}-${APP}
      ports:
        - port: 8443
