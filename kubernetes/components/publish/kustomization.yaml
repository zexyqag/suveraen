---
# Lets the namespace publish ports on the nodes' addresses (LoadBalancer Services, whose packets kube-proxy forwards
# before the host firewall sees them). platform/policies refuses them everywhere else.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: _
        labels:
          suveraen/publish: "true"
