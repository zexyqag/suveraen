---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  labels:
    suveraen/backup: volsync
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: ${DATA_SIZE}
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: data
---
# Restores into a volume of its own that it keeps, so files deleted since an earlier restore go too.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: data
spec:
  trigger:
    manual: ${DATA_RESTORE}
  restic:
    repository: ${DATA_RESTORE_FROM}
    enableFileDeletion: true
    capacity: ${DATA_SIZE}
    accessModes: [ReadWriteOnce]
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: data-1
  annotations:
    suveraen/max-age: ${DATA_MAX_AGE}
spec:
  sourcePVC: data
  trigger:
    schedule: ${DATA_SCHEDULE_1}
  restic:
    repository: offsite-1
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: data-2
  annotations:
    suveraen/max-age: ${DATA_MAX_AGE}
spec:
  sourcePVC: data
  trigger:
    schedule: ${DATA_SCHEDULE_2}
  restic:
    repository: offsite-2
