---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-postgres
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${TENANT}-postgres
          podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - port: 5432
