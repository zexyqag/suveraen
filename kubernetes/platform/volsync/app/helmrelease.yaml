---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: flux-system
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: volsync
  releaseName: volsync
  chartRef:
    kind: HelmChart
    name: volsync
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart's CRDs are templates: never turned off, or every copy's schedule would go with them.
    manageCRDs: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: volsync
            patch: |-
              - op: add
                path: /spec/template/spec/priorityClassName
                value: platform
