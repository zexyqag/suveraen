---
# Two pod labels open a way out of a tenant's namespace: suveraen/egress to the internet (components/internet) and
# suveraen/object-store to the cluster's object store (apps/postgres). An app's charts, which run as its namespace's
# deployer, must not hand them to their own pods, nor change what a pod or job that carries one runs: only the backup
# jobs and movers the platform runs carry them, made by Flux, the job and CronJob controllers, CloudNativePG or
# VolSync, and an app's proxy to the hosts its template lists (components/egress), whose Deployment Flux alone makes,
# its ReplicaSets the deployment controller and their pods the ReplicaSet controller. A label comes only with the
# object that carries it: no one but the cluster's admins may give one to an object already made, such as one another
# made, whose containers a maker's apply would keep. Others may still change such an object's metadata, as the garbage
# collector does, but not its labels, which would take a pod from what owns it, nor what tells Flux to leave it be.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: egress-labels
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, replicationcontrollers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
    namespaceSelector:
      matchExpressions:
        - key: suveraen/tenant
          operator: Exists
  variables:
    - name: labels
      expression: >-
        request.resource.resource == 'pods' ? object.metadata.?labels.orValue({}) :
        request.resource.resource == 'cronjobs' ? object.spec.jobTemplate.spec.template.metadata.?labels.orValue({}) :
        object.spec.template.metadata.?labels.orValue({})
    - name: before
      expression: >-
        oldObject == null ? {} :
        request.resource.resource == 'pods' ? oldObject.metadata.?labels.orValue({}) :
        request.resource.resource == 'cronjobs' ? oldObject.spec.jobTemplate.spec.template.metadata.?labels.orValue({}) :
        oldObject.spec.template.metadata.?labels.orValue({})
    - name: carried
      expression: >-
        ['suveraen/egress', 'suveraen/object-store'].exists(k, k in variables.labels || k in variables.before)
    - name: unchanged
      expression: >-
        request.operation == 'UPDATE' && object.spec == oldObject.spec &&
        object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
        ['kustomize.toolkit.fluxcd.io/reconcile', 'kustomize.toolkit.fluxcd.io/ssa'].all(k,
        (k in object.metadata.?annotations.orValue({})) == (k in oldObject.metadata.?annotations.orValue({})) &&
        (!(k in object.metadata.?annotations.orValue({})) ||
        object.metadata.annotations[k] == oldObject.metadata.annotations[k]))
    - name: makers
      expression: >-
        request.resource.resource == 'pods' ? ['system:serviceaccount:kube-system:job-controller',
        'system:serviceaccount:kube-system:replicaset-controller', 'system:serviceaccount:cloudnative-pg:cloudnative-pg'] :
        request.resource.resource == 'jobs' ? ['system:serviceaccount:kube-system:cronjob-controller',
        'system:serviceaccount:cloudnative-pg:cloudnative-pg', 'system:serviceaccount:volsync:volsync',
        'system:serviceaccount:flux-system:kustomize-controller'] :
        request.resource.resource == 'replicasets' ? ['system:serviceaccount:kube-system:deployment-controller'] :
        request.resource.resource in ['cronjobs', 'deployments'] ?
        ['system:serviceaccount:flux-system:kustomize-controller'] : []
  validations:
    - expression: >-
        !variables.carried || variables.unchanged || request.userInfo.username in variables.makers ||
        'system:masters' in request.userInfo.groups
      message: only the platform's backup jobs, movers and egress proxies reach the internet or the object store from a tenant
    - expression: >-
        request.operation != 'UPDATE' || 'system:masters' in request.userInfo.groups ||
        ['suveraen/egress', 'suveraen/object-store'].all(k, !(k in variables.labels) || k in variables.before)
      message: a label that opens a way out of a tenant's namespace comes only with the object that carries it
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: egress-labels
spec:
  policyName: egress-labels
  validationActions: [Deny]
