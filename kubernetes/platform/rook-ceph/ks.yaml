---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph
spec:
  path: ./kubernetes/platform/rook-ceph/app
  # The operator, Ceph's daemons and the CSI plugins share one namespace, the only privileged one.
  components:
    - ../../../components/platform
    - ../../../components/privileged
  postBuild:
    substitute:
      NAMESPACE: rook-ceph
