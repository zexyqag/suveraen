---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: flux-system
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: rook-ceph
  releaseName: rook-ceph
  chartRef:
    kind: HelmChart
    name: rook-ceph
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Never turned off: the cluster's own objects would go with the CRDs.
    crds:
      enabled: true
    priorityClassName: platform
    csi:
      # Rook connects the drivers to the cluster (CephConnection, ClientProfile).
      createCsiOperatorResources: true
    ceph-csi-operator:
      controllerManager:
        priorityClassName: platform
  # The CSI operator's chart gives its pods a network policy whose one egress rule names no peer, so reaches
  # everything, which the cluster refuses (platform/policies/network-policies). It keeps only its ingress, which it
  # denies, and its pods' egress is the namespace's, as for the rest of Rook's.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: networking.k8s.io
              kind: NetworkPolicy
              name: ceph-csi-ceph-csi-controller-manager
            patch: |-
              - op: remove
                path: /spec/egress
              - op: replace
                path: /spec/policyTypes
                value: [Ingress]
