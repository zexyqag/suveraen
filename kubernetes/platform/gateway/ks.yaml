---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
spec:
  path: ./kubernetes/platform/gateway/app
  components:
    - ../../../components/platform
    - ../../../components/publish
  dependsOn:
    - name: gateway-api
  postBuild:
    substitute:
      NAMESPACE: gateway
