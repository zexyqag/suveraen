---
# Listed instead of platform/issuer/public while the primary CA can't issue: new and renewed certificates come from the
# standby CA.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: issuer
spec:
  path: ./kubernetes/platform/issuer/failover/app
  dependsOn:
    - name: cert-manager
