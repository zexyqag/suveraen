---
# Both CAs' accounts. ClusterIssuers read their Secrets from cert-manager's own namespace.
apiVersion: v1
kind: Secret
metadata:
  name: acme
  namespace: cert-manager
data:
  public-account: ${ACME_PUBLIC_ACCOUNT_KEY}
  standby-account: ${ACME_STANDBY_ACCOUNT_KEY}
stringData:
  standby-eab: ${ACME_STANDBY_EAB_HMAC}
