---
# The CA every host's certificate comes from. Its account key is never generated here, so a rebuilt cluster keeps the
# account that CAA names.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: public
spec:
  acme:
    server: ${ACME_SERVER}
    disableAccountKeyGeneration: true
    privateKeySecretRef:
      name: acme
      key: public-account
