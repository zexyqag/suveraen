---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  # Operator charts install CRDs, cluster roles and webhooks, which only Flux's own cluster-wide account may do.
  serviceAccountName: helm-controller
  targetNamespace: cert-manager
  releaseName: cert-manager
  chartRef:
    kind: HelmChart
    name: cert-manager
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
      keep: true
    startupapicheck:
      enabled: false
    # A certificate's key goes with it: removing a host leaves no key behind in the gateway namespace.
    enableCertificateOwnerRef: true
    # A challenge's record is checked through the cluster's DNS: asking each of the zone's nameservers itself would take
    # port 53 to any address.
    dns01RecursiveNameserversOnly: true
    global:
      priorityClassName: platform
      leaderElection:
        namespace: cert-manager
      rbac:
        # Only the platform asks for certificates: the built-in admin and edit roles get no cert-manager rights.
        aggregateClusterRoles: false
