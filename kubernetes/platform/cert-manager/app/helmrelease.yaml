---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  # Operator charts install CRDs, cluster roles and webhooks, which only Flux's own cluster-wide account may do.
  serviceAccountName: helm-controller
  targetNamespace: cert-manager
  releaseName: cert-manager
  chartRef:
    kind: HelmChart
    name: cert-manager
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true
    image:
      tag: v1.21.2@sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
    webhook:
      image:
        tag: v1.21.2@sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
    cainjector:
      image:
        tag: v1.21.2@sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
    startupapicheck:
      enabled: false
    # A certificate's key goes with it: removing a host leaves no key behind in the gateway namespace.
    enableCertificateOwnerRef: true
    global:
      priorityClassName: platform
      leaderElection:
        namespace: cert-manager
      rbac:
        # Only the platform asks for certificates: the built-in admin and edit roles get no cert-manager rights.
        aggregateClusterRoles: false
