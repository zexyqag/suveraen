---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: cloudnative-pg
  releaseName: cloudnative-pg
  chartRef:
    kind: HelmChart
    name: cloudnative-pg
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    priorityClassName: platform
    config:
      clusterWide: true
    # Only the platform makes databases: the built-in admin and edit roles get no CloudNativePG rights.
    rbac:
      aggregateClusterRoles: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-cloud
  namespace: flux-system
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: cloudnative-pg
  releaseName: barman-cloud
  chartRef:
    kind: HelmChart
    name: barman-cloud
  dependsOn:
    - name: cloudnative-pg
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    priorityClassName: platform
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
