---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: cloudnative-pg
  releaseName: cloudnative-pg
  chartRef:
    kind: HelmChart
    name: cloudnative-pg
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    priorityClassName: platform
    config:
      clusterWide: true
    # Only the platform makes databases: the built-in admin and edit roles get no CloudNativePG rights.
    rbac:
      aggregateClusterRoles: false
    # In seconds: losing its lease stops the operator, so the lease outlasts the API's stalls on a busy server.
    additionalArgs:
      - --leader-lease-duration=45
      - --leader-renew-deadline=30
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-cloud
  namespace: flux-system
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: cloudnative-pg
  releaseName: barman-cloud
  chartRef:
    kind: HelmChart
    name: barman-cloud
  dependsOn:
    - name: cloudnative-pg
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    priorityClassName: platform
    # One copy runs, so it needs no leader, whose lease lost while the API stalls would stop it. This follows the
    # chart's --leader-elect, and the last one counts.
    additionalArgs:
      - --leader-elect=false
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
