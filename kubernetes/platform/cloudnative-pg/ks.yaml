---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
spec:
  path: ./kubernetes/platform/cloudnative-pg/app
  components:
    - ../../../components/platform
    - ../../../components/private-ca
  dependsOn:
    - name: cert-manager
  postBuild:
    substitute:
      NAMESPACE: cloudnative-pg
