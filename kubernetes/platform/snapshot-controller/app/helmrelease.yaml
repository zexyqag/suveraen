---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: flux-system
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: snapshot-controller
  releaseName: snapshot-controller
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Removing the chart would otherwise take every VolumeSnapshot with its CRDs.
    keepCRDs: true
    webhook:
      enabled: false
    controller:
      priorityClassName: platform
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
