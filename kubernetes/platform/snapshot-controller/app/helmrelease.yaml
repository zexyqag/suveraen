---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: flux-system
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: snapshot-controller
  releaseName: snapshot-controller
  chartRef:
    kind: HelmChart
    name: snapshot-controller
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Removing the chart would otherwise take every VolumeSnapshot with its CRDs.
    keepCRDs: true
    webhook:
      enabled: false
    controller:
      image:
        # The version of Rook's csi-snapshotter sidecar.
        tag: v8.6.0@sha256:81e79f205083f105e573ba2ebfe5964ede7f69a154e8627f53ebbbccd3ed9f70
      priorityClassName: platform
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
