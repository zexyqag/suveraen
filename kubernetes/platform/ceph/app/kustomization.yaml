---
# One Ceph cluster for the whole platform: encrypted OSDs on the disks the hosts name, three copies of everything,
# block volumes with snapshots and an object store. Every pool keeps the cluster's failure domain, the OSD while it
# is one server and the host from three. Rook's objects here are never pruned: dropping one from Git leaves it running.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cluster.yaml
  - ./pools.yaml
  - ./csi.yaml
  - ./csi-accounts.yaml
  - ./unmap-barrier.yaml
  - ./storageclasses.yaml
  - ./objectstore.yaml
  - ./networkpolicy.yaml
# The pins Rook's record gives its chart, of which the barrier takes the node plugin's (unmap-barrier.yaml).
configMapGenerator:
  - name: rook-ceph-images
    envs:
      - ../../rook-ceph/vendor/rook-ceph.images.env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
replacements:
  - source:
      kind: ConfigMap
      name: rook-ceph-images
      fieldPath: data.[csi.cephcsi.tag]
    targets:
      - select:
          kind: DaemonSet
          name: unmap-barrier
        fieldPaths:
          - spec.template.spec.containers.[name=wait].image
        options:
          create: true
