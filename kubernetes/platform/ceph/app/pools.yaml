---
# Ceph's own pool for the manager, which would otherwise spread over hosts the cluster may not have yet.
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: builtin-mgr
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  name: .mgr
  failureDomain: ${CEPH_FAILURE_DOMAIN}
  enableCrushUpdates: true
  replicated:
    size: 3
    requireSafeReplicaSize: true
  parameters:
    min_size: "2"
    # The bounds Ceph's manager gives the pool when it makes it first. Made here instead, before the OSDs are up, it
    # would have none: the autoscaler would hold it at 32 placement groups, past Ceph's limit per OSD on three disks.
    pg_num_min: "1"
    pg_num_max: "32"
---
# Every block volume, platform's and tenants' alike; per-tenant pools would be too many placement groups.
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: block
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  failureDomain: ${CEPH_FAILURE_DOMAIN}
  enableCrushUpdates: true
  replicated:
    size: 3
    requireSafeReplicaSize: true
  parameters:
    min_size: "2"
    bulk: "true"
