---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  security:
    cephx:
      # Kernel clients older than Linux 7.0 don't know the newer key type.
      csi:
        keyType: aes
  # The monitors alone hold the OSDs' disk keys, so there are three even on one server.
  mon:
    count: 3
    allowMultiplePerNode: ${CEPH_DAEMONS_SHARE_NODE}
  mgr:
    count: ${CEPH_MGR_COUNT}
    allowMultiplePerNode: ${CEPH_DAEMONS_SHARE_NODE}
    modules:
      - name: rook
        enabled: false
  dashboard:
    enabled: false
  monitoring:
    enabled: false
    metricsDisabled: true
  logCollector:
    enabled: false
  crashCollector:
    disable: false
  network:
    connections:
      requireMsgr2: true
      # Between nodes the pod network already runs over WireGuard.
      encryption:
        enabled: false
  priorityClassNames:
    all: platform
  resources:
    # Ceph sizes the OSD's caches from its limit; requests match, so the OSDs are the last pods evicted.
    osd:
      requests:
        cpu: 250m
        memory: ${CEPH_OSD_MEMORY}
      limits:
        memory: ${CEPH_OSD_MEMORY}
    mon:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    mgr:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  # Numbers live here, not in the cluster's settings: Flux would substitute them as integers, and these take strings.
  cephConfig:
    global:
      osd_pool_default_size: "3"
      osd_pool_default_min_size: "2"
    mgr:
      # With Ceph's default factor of 3 the autoscaler leaves a pool the share it got before the other pools existed:
      # 249 of 250 placement groups per OSD on three disks. At 1.0 the counts follow only the OSDs and pools.
      mgr/pg_autoscaler/threshold: "1.0"
      # Ceph warns at 80% of a pool's quota and calls it an error at 90%, before writes stop at 100%.
      mon_pool_quota_warn_threshold: "80"
      mon_pool_quota_crit_threshold: "90"
  healthCheck:
    # Raised for the older key type kernel clients need (security.cephx.csi).
    muteHealthWarning:
      AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_CLIENT_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_KEYS_ALLOWED:
        policy: mute
      AUTH_INSECURE_KEYS_CREATABLE:
        policy: mute
  disruptionManagement:
    managePodBudgets: true
  # The hosts decide by the links they make (suveraen.storage.ceph.disks); a slot a node lacks is skipped. Each OSD's
  # database is a logical volume on the system disks, on both where there are two, and block and database are both
  # encrypted.
  storage:
    useAllNodes: true
    useAllDevices: false
    config:
      encryptedDevice: "true"
    devices:
      - name: /dev/disk/by-osd/osd0
        config:
          metadataDevice: /dev/disk/by-osd/osd0-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd1
        config:
          metadataDevice: /dev/disk/by-osd/osd1-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd2
        config:
          metadataDevice: /dev/disk/by-osd/osd2-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd3
        config:
          metadataDevice: /dev/disk/by-osd/osd3-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd4
        config:
          metadataDevice: /dev/disk/by-osd/osd4-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd5
        config:
          metadataDevice: /dev/disk/by-osd/osd5-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd6
        config:
          metadataDevice: /dev/disk/by-osd/osd6-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd7
        config:
          metadataDevice: /dev/disk/by-osd/osd7-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd8
        config:
          metadataDevice: /dev/disk/by-osd/osd8-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd9
        config:
          metadataDevice: /dev/disk/by-osd/osd9-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd10
        config:
          metadataDevice: /dev/disk/by-osd/osd10-db
          deviceClass: hdd
      - name: /dev/disk/by-osd/osd11
        config:
          metadataDevice: /dev/disk/by-osd/osd11-db
          deviceClass: hdd
