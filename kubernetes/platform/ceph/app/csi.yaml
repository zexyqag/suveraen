---
# What Rook's own operator.yaml sets up for the CSI operator, and what its drivers chart would add (csi-accounts.yaml);
# the chart is published only to a Helm repository, which nothing could pin. Only RBD: no shared file system yet.
apiVersion: csi.ceph.io/v1
kind: OperatorConfig
metadata:
  name: ceph-csi-operator-config
  namespace: rook-ceph
spec:
  driverSpecDefaults:
    fsGroupPolicy: File
    nodePlugin:
      # Stopped last on a shutdown, with Ceph, so it serves every unmap.
      priorityClassName: system-node-critical
      kubeletDirPath: /var/lib/kubelet
    controllerPlugin:
      priorityClassName: platform
---
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.rbd.csi.ceph.com
  namespace: rook-ceph
spec:
  # The images Rook's chart pins. Named here, not in the defaults: the operator reconciles a Driver it sees before
  # the OperatorConfig with its own images, by tag, which pods may not run.
  imageSet:
    name: rook-csi-operator-image-set-configmap
  # The accounts as the chart names them; the operator's own default depends on a prefix Rook's chart sets.
  nodePlugin:
    serviceAccountName: rook-ceph-rbd-csi-ceph-com-nodeplugin-sa
    updateStrategy:
      type: RollingUpdate
  controllerPlugin:
    serviceAccountName: rook-ceph-rbd-csi-ceph-com-ctrlplugin-sa
    # Here: the operator takes no strategy from the defaults for a Driver with a controllerPlugin of its own.
    deploymentStrategy:
      type: Recreate
    # One snapshot call at a time, up to the sidecar's timeout: both providers' copies snapshot the same image, and
    # librbd 20.2 can assert on two snapshot calls of one image in one process, which hangs cephcsi as PID 1
    # (ceph-csi#6676).
    containerExtraArgs:
      csi-snapshotter:
        - --worker-threads=1
