---
# Served in the cluster only, over plain HTTP at rook-ceph-rgw-objects.rook-ceph.svc: no certificate authority signs
# for internal names here, and nodes reach each other through WireGuard.
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: objects
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  metadataPool:
    failureDomain: ${CEPH_FAILURE_DOMAIN}
    enableCrushUpdates: true
    replicated:
      size: 3
      requireSafeReplicaSize: true
    parameters:
      min_size: "2"
  dataPool:
    failureDomain: ${CEPH_FAILURE_DOMAIN}
    enableCrushUpdates: true
    replicated:
      size: 3
      requireSafeReplicaSize: true
    parameters:
      min_size: "2"
      bulk: "true"
    # Above every tenant's bucket limit, so a tenant meets its own first.
    quotas:
      maxSize: ${CEPH_OBJECTS_QUOTA}
  preservePoolsOnDelete: true
  gateway:
    port: 80
    instances: ${CEPH_RGW_INSTANCES}
    priorityClassName: platform
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  # S3 for the buckets and the admin API Rook manages their users and quotas with, nothing else: notifications would
  # let anyone with a tenant's keys have RGW send requests wherever its pods may connect, and nothing here uses Swift,
  # STS, IAM or S3 websites.
  protocols:
    enableAPIs: [s3, admin]
