---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: reloader
  releaseName: reloader
  chartRef:
    kind: OCIRepository
    name: reloader
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    reloader:
      # Restarts only apps; platform pieces are rolled by their own charts.
      namespaceSelector: suveraen/tier=app
      # Also when a ConfigMap or Secret an app reads appears, such as an app's migration for Kanidm (components/sso),
      # which Kanidm reads only as it starts; not for those already there when Reloader starts.
      reloadOnCreate: true
      readOnlyRootFileSystem: true
      deployment:
        priorityClassName: platform
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
