---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd
  interval: 24h
  retryInterval: 2m
  timeout: 10m
  # A CRD that disappears here would take every object of its kind with it.
  prune: false
  wait: true
