---
# The platform every cluster runs. Each cluster also lists the public issuer, platform/issuer/public (or
# platform/issuer/failover while its CA can't issue), which every piece that needs certificates depends on by its
# name, "issuer", and the standby CA, platform/issuer/standby.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./policies/ks.yaml
  - ./gateway-api/ks.yaml
  - ./cert-manager/ks.yaml
  - ./gateway/ks.yaml
  - ./reloader/ks.yaml
  - ./snapshot-controller/ks.yaml
  - ./rook-ceph/ks.yaml
  - ./ceph/ks.yaml
  - ./cloudnative-pg/ks.yaml
  - ./pg-catalog/ks.yaml
