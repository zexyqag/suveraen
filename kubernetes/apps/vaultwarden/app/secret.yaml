---
# What Vaultwarden takes from the tenant's Secret, by env alone: its role's password, and the tenant's installation at
# Bitwarden's relay, which the tenant registers there.
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden
stringData:
  db-password: ${VAULTWARDEN_DB_PASSWORD}
  push-installation-id: ${VAULTWARDEN_PUSH_INSTALLATION_ID}
  push-installation-key: ${VAULTWARDEN_PUSH_INSTALLATION_KEY}
