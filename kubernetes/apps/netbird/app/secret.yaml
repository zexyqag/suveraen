---
# What management, its scrub and the relay take from the tenant's Secret, by env alone: management's own role over TLS
# and, for the scrub, its password alone, the key its store encrypts with, and the secret its relay tokens are signed
# with.
apiVersion: v1
kind: Secret
metadata:
  name: netbird
stringData:
  store-dsn: host=postgres-rw.${TENANT}-postgres.svc port=5432 dbname=${APP} user=${APP} password=${NETBIRD_DB_PASSWORD} sslmode=require
  db-password: "${NETBIRD_DB_PASSWORD}"
  store-key: "${NETBIRD_STORE_KEY}"
  relay-secret: "${NETBIRD_RELAY_SECRET}"
