---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kanidm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kanidm
  values:
    controllers:
      kanidm:
        # One pod on the volume, the old one gone before the new one starts.
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          enableServiceLinks: false
        containers:
          app:
            image:
              repository: docker.io/kanidm/server
              tag: 1.11.2@sha256:e45f00bd354c1fc1c06a4be484b4e87b094c431e78280f1d19e911815e63efb5
            env:
              # Also for kanidmd run by exec in the pod, which finds the server's admin socket through it.
              KANIDM_CONFIG: /config/server.toml
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 8443
                    scheme: HTTPS
                  periodSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 8443
                    scheme: HTTPS
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 8443
                    scheme: HTTPS
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: ${MEMORY}
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 389
        runAsGroup: 389
        fsGroup: 389
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: kanidm
        ipFamilyPolicy: PreferDualStack
        # Apps reach it at its public name on 443, which the cluster's DNS answers with this Service.
        ports:
          https:
            port: 443
            targetPort: 8443
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: data
        globalMounts:
          - path: /data
      config:
        type: configMap
        name: kanidm
        globalMounts:
          - path: /config
            readOnly: true
      tls:
        type: secret
        name: tls
        globalMounts:
          - path: /tls
            readOnly: true
      # The platform's migrations and each app's (components/sso), as each app's appears only once a tenant runs it.
      migrations:
        type: projected
        sources:
          - configMap:
              name: kanidm-migrations
          - configMap:
              name: sso-hello
              optional: true
          - configMap:
              name: sso-netbird
              optional: true
        globalMounts:
          - path: /migrations
            readOnly: true
      # The admin socket, off the volume and its copies.
      run:
        type: emptyDir
        globalMounts:
          - path: /run/kanidmd
