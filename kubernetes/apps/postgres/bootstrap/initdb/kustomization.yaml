---
# A new, empty cluster. Apps get their databases from their attachments; this one stays unused.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Cluster
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: _
      spec:
        bootstrap:
          initdb:
            database: app
            owner: app
