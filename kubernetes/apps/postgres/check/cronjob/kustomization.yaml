---
# The CronJob offsite's pod, which the outer component then turns to checking one provider's copy.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./cronjob.yaml
replacements:
  - source:
      kind: CronJob
      name: offsite
      fieldPath: spec.jobTemplate.spec.template
    targets:
      - select:
          kind: CronJob
          name: offsite-check-1
        fieldPaths: [spec.jobTemplate.spec.template]
      - select:
          kind: CronJob
          name: offsite-check-2
        fieldPaths: [spec.jobTemplate.spec.template]
