---
# A check that passed leaves no Job, as the CronJob's last successful time records it; the last that failed keeps its
# log. One retry rides out a copy or a prune that overlapped it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-check-1
spec:
  schedule: "${OFFSITE_CHECK_SCHEDULE_1}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          containers: []
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-check-2
spec:
  schedule: "${OFFSITE_CHECK_SCHEDULE_2}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          containers: []
