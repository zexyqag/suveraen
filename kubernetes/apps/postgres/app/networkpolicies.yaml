---
# The operator manages the instances through their status port and PostgreSQL itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-operator
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 8000
        - port: 5432
---
# The instances' Barman sidecar, and the jobs that copy the bucket, reach the object store.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-object-store
spec:
  podSelector:
    matchLabels:
      suveraen/object-store: client
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
          podSelector:
            matchLabels:
              app: rook-ceph-rgw
      ports:
        - port: 8080
---
# CloudNativePG's instance managers, their Barman sidecars and its jobs talk to the API server on the nodes, which
# the pods on other nodes reach through this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-server
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: ${NODE_CIDR_V4}
        - ipBlock:
            cidr: "${NODE_CIDR_V6}"
      ports:
        - protocol: TCP
          port: 6443
