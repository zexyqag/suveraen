---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./objectbucketclaim.yaml
  - ./objectstore.yaml
  - ./networkpolicies.yaml
  - ./offsite.yaml
configMapGenerator:
  - name: offsite-script
    files:
      - ./offsite.sh
    options:
      # A shell script: its variables are its own.
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
components:
  - ../../../components/internet
  - ../fetch
  - ../check
