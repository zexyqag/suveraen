---
# The cluster recovers from provider 2's copy: generation ORIGIN is decrypted back into the tenant's bucket first, and
# the cluster's Kustomization waits for that.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ../job.yaml
patches:
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command/3
        value: "2"
