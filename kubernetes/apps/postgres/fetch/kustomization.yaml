---
# Job fetch-<generation>, which runs before each generation's cluster is made: with POSTGRES_RESTORE_FROM offsite-1
# or offsite-2 it decrypts generation ORIGIN back into the tenant's bucket from that provider, and the cluster's
# Kustomization waits for it. It runs as the CronJob offsite's pods do.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ./job
patches:
  - target:
      kind: Job
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: _
      spec:
        template:
          spec:
            containers:
              - name: rclone
                args: [fetch]
