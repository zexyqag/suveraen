---
apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-${GENERATION}
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        suveraen/object-store: client
        suveraen/egress: internet
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rclone
          image: ghcr.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
          command: [sh, /scripts/offsite.sh, fetch, provider]
          envFrom:
            - configMapRef:
                name: offsite
            - secretRef:
                name: offsite
            - configMapRef:
                name: bucket
            - secretRef:
                name: bucket
          env:
            - name: HOME
              value: /tmp
            - name: ORIGIN
              value: ${ORIGIN}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: offsite-script
        - name: tmp
          emptyDir: {}
