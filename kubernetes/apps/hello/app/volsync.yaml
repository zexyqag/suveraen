---
# The keys for the copies of hello's volume (components/volsync).
apiVersion: v1
kind: Secret
metadata:
  name: offsite-1
stringData:
  RESTIC_REPOSITORY: s3:${BACKUP_1_ENDPOINT}/${BACKUP_1_BUCKET_PREFIX}${TENANT}/volsync/${APP}
  RESTIC_PASSWORD: ${HELLO_RESTIC_PASSWORD}
  AWS_ACCESS_KEY_ID: ${HELLO_BACKUP_1_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${HELLO_BACKUP_1_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${BACKUP_1_REGION}
---
apiVersion: v1
kind: Secret
metadata:
  name: offsite-2
stringData:
  RESTIC_REPOSITORY: s3:${BACKUP_2_ENDPOINT}/${BACKUP_2_BUCKET_PREFIX}${TENANT}/volsync/${APP}
  RESTIC_PASSWORD: ${HELLO_RESTIC_PASSWORD}
  AWS_ACCESS_KEY_ID: ${HELLO_BACKUP_2_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${HELLO_BACKUP_2_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${BACKUP_2_REGION}
