---
# The smallest app built from the template; the test tenants run it to prove the template end to end.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${TENANT}-hello
spec:
  path: ./kubernetes/apps/hello/app
  targetNamespace: ${TENANT}-hello
  components:
    - ../../../components/app
    - ../../../components/db-client
    - ../../../components/volsync
  dependsOn:
    - name: policies
    - name: volsync
    - name: ceph
    - name: ${TENANT}-hello-db
  postBuild:
    substitute:
      APP: hello
      QUOTA_CPU: ${HELLO_QUOTA_CPU:=100m}
      # The app and up to three movers at 256Mi each.
      QUOTA_MEMORY: ${HELLO_QUOTA_MEMORY:=1Gi}
      QUOTA_EPHEMERAL_STORAGE: ${HELLO_QUOTA_EPHEMERAL_STORAGE:=1Gi}
      # The volume and the three movers' copies of it, each mover with a 256Mi cache.
      QUOTA_STORAGE: ${HELLO_QUOTA_STORAGE:=5Gi}
      # Flux reads a substituted value that looks like a number back as one, which a Kustomization refuses, so a
      # tenant can resize only quantities with a unit.
      QUOTA_VOLUMES: "8"
      QUOTA_PODS: "6"
      QUOTA_SERVICES: "2"
      QUOTA_SECRETS: "10"
      QUOTA_CONFIGMAPS: "4"
      QUOTA_JOBS: "3"
      DATA_SIZE: ${HELLO_DATA_SIZE:=1Gi}
      DATA_UID: "65534"
      DATA_SCHEDULE_1: ${HELLO_DATA_SCHEDULE_1:=17 * * * *}
      DATA_SCHEDULE_2: ${HELLO_DATA_SCHEDULE_2:=47 * * * *}
      # A new value restores the latest copy again, from offsite-1 or offsite-2.
      DATA_RESTORE: ${HELLO_DATA_RESTORE:=once}
      DATA_RESTORE_FROM: ${HELLO_DATA_RESTORE_FROM:=offsite-1}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${TENANT}-hello-edge-hello
spec:
  path: ./kubernetes/edge/app
  dependsOn:
    - name: ${TENANT}-hello
    - name: gateway
    - name: issuer
  postBuild:
    substitute:
      APP: hello
      EDGE: hello
      HOST: hello
      ROUTE_PORT: "9898"
---
# Its database and role in the tenant's PostgreSQL (apps/postgres, components/db).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${TENANT}-hello-db
spec:
  path: ./kubernetes/apps/hello/db
  dependsOn:
    - name: ${TENANT}-postgres-cluster
  postBuild:
    substitute:
      APP: hello
