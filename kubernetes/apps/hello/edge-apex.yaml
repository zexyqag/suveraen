---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${TENANT}-hello-edge-apex
spec:
  path: ./kubernetes/edge/apex
  dependsOn:
    - name: ${TENANT}-hello
    - name: gateway
    - name: issuer
  postBuild:
    substitute:
      APP: hello
      EDGE: apex
      ROUTE_PORT: "9898"
