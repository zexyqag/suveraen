---
# hello's group, whose members tenant-admins manage, and its confidential client in its tenant's Kanidm
# (components/sso). Each ID comes from the tenant's Secret, so no one there knows it before Kanidm makes the entry: a
# tenant admin may give a person any ID, and the file would then change that person or fail on them. IDs are fixed for
# good: Kanidm finds an entry by its ID, and never takes one back once a removal named it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sso-hello
  namespace: ${TENANT}-kanidm
data:
  50-hello.json: |
    {
      "id": "${HELLO_SSO_ID}",
      "assertions": [
        {
          "state": "present",
          "id": "${HELLO_USERS_ID}",
          "class": ["group"],
          "name": "hello-users",
          "entry_managed_by": ["tenant-admins"]
        },
        {
          "state": "present",
          "id": "${HELLO_OIDC_ID}",
          "class": ["account", "oauth2_resource_server", "oauth2_resource_server_basic"],
          "name": "hello-oidc",
          "displayname": "hello",
          "oauth2_rs_origin": ["https://hello.${TENANT_APP_DOMAIN}/oauth2/callback"],
          "oauth2_rs_origin_landing": "https://hello.${TENANT_APP_DOMAIN}/",
          "oauth2_rs_scope_map": [{ "group": "hello-users", "scopes": ["openid", "profile"] }]
        }
      ]
    }
