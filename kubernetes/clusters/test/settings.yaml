---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
data:
  # Its tenants and accounts are stand-ins, so their domains and secrets may be in the clear (checks/render.sh).
  TEST_CLUSTER: "true"
  # The e2e's test ACME CAs (Pebble, behind nixpkgs' test CA); the standby one requires our external account.
  ACME_SERVER: https://acme.test/dir
  ACME_STANDBY_SERVER: https://acme.test:14000/dir
  ACME_CA_BUNDLE: 
  # One server: Ceph spreads copies over OSDs, and its daemons share the node. A real cluster of three or more
  # servers sets host and "false".
  CEPH_FAILURE_DOMAIN: osd
  CEPH_DAEMONS_SHARE_NODE: "true"
  # Ceph's smallest cache size for an OSD; a real server gives each 5Gi.
  CEPH_OSD_MEMORY: 1152Mi
  # The most the block pool and the object store's data pool hold, one copy counted. Together at most 0.80 x the data
  # disks' bytes / 3 copies x f, so the OSDs stay below Ceph's nearfull mark once a lost OSD's copies have moved. f is
  # the share of OSDs left where those copies go: with failure domain osd, (N-1)/N for N > 3 OSDs in all; with host,
  # (n-1)/n for n > 1 OSDs per server, or with one per server (H-1)/H for H > 3 servers; else 1. 8 GiB on the test's
  # 3 x 10 GiB.
  CEPH_BLOCK_QUOTA: 4Gi
  CEPH_OBJECTS_QUOTA: 2Gi
  # One Ceph manager, one object gateway and one instance per database cluster while there is one server; two, two
  # and three from three servers.
  CEPH_MGR_COUNT: "1"
  CEPH_RGW_INSTANCES: "1"
  PG_INSTANCES: "1"
  # The two providers that keep the off-site copies: stand-ins on the e2e's internet node, over plain HTTP. A real
  # cluster's are at two independent companies, over https.
  BACKUP_1_ENDPOINT: http://s3-1.test
  BACKUP_1_REGION: us-east-1
  BACKUP_1_PROVIDER: Other
  BACKUP_1_BUCKET_PREFIX: test-
  BACKUP_2_ENDPOINT: http://s3-2.test
  BACKUP_2_REGION: us-east-1
  BACKUP_2_PROVIDER: Other
  BACKUP_2_BUCKET_PREFIX: test-
  # The cluster's own ranges, as nixos/cluster.nix gives them to k3s, and its nodes, which the internet's network
  # policy leaves out.
  POD_CIDR_V4: 10.42.0.0/16
  POD_CIDR_V6: fd42::/56
  SERVICE_CIDR_V4: 10.43.0.0/16
  SERVICE_CIDR_V6: fd43::/112
  NODE_CIDR_V4: 192.168.1.3/32
  NODE_CIDR_V6: fd00::2/128
