---
# Shaped like the members' tenant: identities on a domain of their own, apps on another.
apiVersion: v1
kind: Secret
metadata:
  name: tenant-alpha
  labels:
    suveraen/tenant: alpha
stringData:
  TENANT_DOMAIN: one.test
  TENANT_APP_DOMAIN: example.test
  # Stand-ins: a real tenant's keys come from its owner, encrypted.
  HELLO_DB_PASSWORD: alpha-hello-test-password
  POSTGRES_BACKUP_1_ACCESS_KEY_ID: alpha-postgres-1
  POSTGRES_BACKUP_1_SECRET_ACCESS_KEY: alpha-postgres-1-test-secret
  POSTGRES_BACKUP_2_ACCESS_KEY_ID: alpha-postgres-2
  POSTGRES_BACKUP_2_SECRET_ACCESS_KEY: alpha-postgres-2-test-secret
  POSTGRES_CRYPT_PASSWORD: alpha-crypt-test-password
  POSTGRES_CRYPT_SALT: alpha-crypt-test-salt
  HELLO_RESTIC_PASSWORD: alpha-hello-restic-test-password
  HELLO_BACKUP_1_ACCESS_KEY_ID: alpha-hello-1
  HELLO_BACKUP_1_SECRET_ACCESS_KEY: alpha-hello-1-test-secret
  HELLO_BACKUP_2_ACCESS_KEY_ID: alpha-hello-2
  HELLO_BACKUP_2_SECRET_ACCESS_KEY: alpha-hello-2-test-secret
