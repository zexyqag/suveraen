---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenant-bravo
  labels:
    suveraen/tenant: bravo
spec:
  path: ./kubernetes/clusters/test/tenants/bravo/apps
  postBuild:
    substitute:
      TENANT: bravo
      # Both tenants' buckets fit in the test cluster's object store quota.
      POSTGRES_BUCKET_SIZE: 1G
      HELLO_QUOTA_MEMORY: 384Mi
