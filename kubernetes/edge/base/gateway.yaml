---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${TENANT}-${APP}-${EDGE}
  namespace: gateway
spec:
  gatewayClassName: traefik
  listeners:
    # Port 80 only redirects here (the chart's entry point redirection).
    - name: https
      protocol: HTTPS
      port: 8443
      hostname: _
      tls:
        mode: Terminate
        certificateRefs:
          - name: ${TENANT}-${APP}-${EDGE}-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: ${TENANT}-${APP}
