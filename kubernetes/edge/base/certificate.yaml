---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${TENANT}-${APP}-${EDGE}
  namespace: gateway
spec:
  secretName: ${TENANT}-${APP}-${EDGE}-tls
  secretTemplate:
    labels:
      suveraen/tenant: ${TENANT}
  dnsNames:
    - _
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: public
