---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: ${EDGE}
  namespace: ${TENANT}-${APP}
spec:
  parentRefs:
    - name: ${TENANT}-${APP}-${EDGE}
      namespace: gateway
      sectionName: tls
  hostnames:
    - ${HOST}.${TENANT_DOMAIN}
  rules:
    - backendRefs:
        - name: ${ROUTE_SERVICE:=${APP}}
          port: ${ROUTE_PORT}
